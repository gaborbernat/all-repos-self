[tool.ruff]
target-version = "py312"
line-length = 120
format.preview = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright header
  "D",                                         # No documentation
  "implicit-namespace-package",                #  no package here
  "incorrect-blank-line-before-class",         # one-blank-line-before-class conflicts with D211
  "missing-trailing-comma",                    # conflict with formatter
  "multi-line-summary-second-line",            # multi-line-summary-first-line conflicts with D212
  "no-self-use",                               # no force static
  "print",                                     # print is fine
  "S",                                         # no security concerns
  "single-line-implicit-string-concatenation", # conflict with formatter
]
lint.isort = { known-first-party = [], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true
